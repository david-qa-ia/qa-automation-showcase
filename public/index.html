<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShopLite</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a href="#/catalog" class="brand">ShopLite</a>
      <nav aria-label="Main" id="nav" hidden>
        <a href="#/catalog">Catalog</a>
        <a href="#/orders">My orders</a>
        <a href="#/cart" data-testid="cart-link">Cart (<span data-testid="cart-count">0</span>)</a>
        <span data-testid="user-name" class="user"></span>
        <button type="button" id="logout">Log out</button>
      </nav>
    </header>

    <main id="app">
      <div role="status" aria-live="polite" id="toast" class="toast" hidden></div>

      <section id="view-login" class="view" hidden>
        <h1>Sign in</h1>
        <form id="login-form" novalidate>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required />
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <p role="alert" class="error" id="login-error" hidden></p>
          <button type="submit">Sign in</button>
        </form>
      </section>

      <section id="view-catalog" class="view" hidden>
        <h1>Catalog</h1>
        <div class="filters">
          <label for="search">Search products</label>
          <input id="search" type="search" placeholder="e.g. keyboard" />
          <label for="category">Category</label>
          <select id="category">
            <option value="">All</option>
            <option value="peripherals">Peripherals</option>
            <option value="displays">Displays</option>
            <option value="audio">Audio</option>
            <option value="accessories">Accessories</option>
          </select>
        </div>
        <p role="alert" class="error" id="catalog-error" hidden></p>
        <ul class="grid" id="product-list" aria-label="Products"></ul>
      </section>

      <section id="view-cart" class="view" hidden>
        <h1>Your cart</h1>
        <p id="cart-empty">Your cart is empty.</p>
        <table id="cart-table" hidden>
          <thead>
            <tr><th scope="col">Product</th><th scope="col">Qty</th><th scope="col">Price</th><th scope="col"><span class="sr-only">Actions</span></th></tr>
          </thead>
          <tbody id="cart-rows"></tbody>
        </table>
        <form id="checkout-form" hidden>
          <label for="coupon">Coupon code (optional)</label>
          <input id="coupon" name="coupon" type="text" />
          <p>Subtotal: <strong data-testid="cart-subtotal">$0.00</strong></p>
          <p role="alert" class="error" id="checkout-error" hidden></p>
          <button type="submit">Place order</button>
        </form>
      </section>

      <section id="view-confirmation" class="view" hidden>
        <h1>Order confirmed</h1>
        <p>Order number: <strong data-testid="order-id"></strong></p>
        <p>Discount: <span data-testid="order-discount"></span></p>
        <p>Total charged: <strong data-testid="order-total"></strong></p>
        <a href="#/orders">See my orders</a>
      </section>

      <section id="view-orders" class="view" hidden>
        <h1>My orders</h1>
        <p id="orders-empty" hidden>You have no orders yet.</p>
        <ul id="orders-list" aria-label="Orders"></ul>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
